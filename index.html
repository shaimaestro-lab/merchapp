<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shai Maestro Merch Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a; 
            overscroll-behavior-y: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view-section.active { display: block; opacity: 1; }
        .input-modern {
            @apply w-full border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:outline-none transition-all shadow-sm appearance-none;
            background-color: #ffffff !important; color: #000000 !important;
        }
        input[type="date"] { background-color: white !important; }
        .card-modern {
            @apply bg-slate-800 rounded-2xl p-5 shadow-xl border border-slate-700/50 mb-5 relative overflow-hidden;
        }
        .btn-primary {
            @apply w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg shadow-blue-900/40 transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-3 text-lg;
        }
        .btn-save-gig {
            @apply w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-black py-5 px-6 rounded-3xl shadow-[0_10px_40px_-10px_rgba(16,185,129,0.5)] transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-4 text-xl tracking-wide uppercase border-t border-emerald-400/20;
            animation: pulse-subtle 3s infinite;
        }
        .btn-fun {
            @apply w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-black py-4 px-6 rounded-2xl shadow-xl shadow-fuchsia-900/40 transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-3 text-lg tracking-wide uppercase;
        }
        .btn-vendor {
            @apply w-full bg-slate-700 hover:bg-slate-600 active:bg-blue-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg border border-slate-600 transition-all duration-150 flex flex-col items-center justify-center relative overflow-hidden;
            height: 140px;
        }
        .btn-secondary {
            @apply w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-3 px-4 rounded-xl shadow border border-slate-600 transform transition-all active:scale-95 flex justify-center items-center gap-2;
        }
        .nav-btn { @apply text-slate-500 transition-all duration-300 flex flex-col items-center justify-center h-full w-full relative z-10; }
        .nav-active { @apply text-blue-400; }
        .nav-active::before {
            content: ''; position: absolute; width: 3.5rem; height: 3.5rem; border-radius: 9999px; border: 1px solid rgba(96,165,250,0.3); background: rgba(59,130,246,0.1); z-index: -1; bottom: 40%; transform: translateY(20%); box-shadow: 0 0 20px rgba(96,165,250,0.4); animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 15px rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 25px rgba(96,165,250,0.7); } 100% { box-shadow: 0 0 15px rgba(96,165,250,0.4); } }
        @keyframes pulse-subtle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        #toast { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 130px; }
        .input-group-text-overlay { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; font-weight: 800; }
        
        .timeline-connector { position: absolute; left: 24px; top: 0; bottom: 0; width: 3px; z-index: 0; opacity: 0.5; }
        .tour-header { @apply cursor-pointer select-none transition-all active:scale-95; }
        .capacity-bar { height: 6px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.1); }
        .capacity-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-32 selection:bg-blue-500 selection:text-white overflow-x-hidden">
    <canvas id="confetti-canvas"></canvas>
    <header class="fixed top-0 w-full bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 z-50 px-5 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10"><i class="fas fa-music text-white text-lg"></i></div>
            <div><h1 class="text-lg font-extrabold tracking-tight text-white leading-none">Shai Maestro</h1><p class="text-[10px] text-blue-400 font-bold tracking-widest uppercase mt-0.5">Merch Sales</p></div>
        </div>
        <button onclick="router('settings')" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition shadow-inner border border-slate-700"><i class="fas fa-cog"></i></button>
    </header>
    <main id="app-content" class="pt-28 px-4 max-w-lg mx-auto relative min-h-screen">
        <div id="view-dashboard" class="view-section active"></div>
        <div id="view-add-show" class="view-section"></div>
        <div id="view-vendor" class="view-section"></div> 
        <div id="view-tour-stock" class="view-section"></div>
        <div id="view-inventory" class="view-section"></div>
        <div id="view-label" class="view-section"></div>
        <div id="view-settings" class="view-section"></div>
    </main>
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-2xl w-full max-w-sm border border-slate-700 shadow-2xl transform transition-all scale-95 opacity-0" id="modalContent">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4"><h3 class="text-xl font-bold text-white text-center w-full" id="modalTitle">Details</h3><button onclick="closeModal()" class="absolute right-6 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button></div>
                <div id="modalBody" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
                <div class="mt-6 pt-4 border-t border-slate-700 flex gap-3" id="modalFooter"></div>
            </div>
        </div>
    </div>
    <div id="toast"><div class="flex items-center justify-center gap-3"><i class="fas fa-check-circle text-green-400 text-xl" id="toastIcon"></i><span id="toastMsg" class="font-bold">Action Saved</span></div><button onclick="handleUndo()" id="undoBtn" class="mt-2 text-xs text-blue-300 underline font-bold uppercase tracking-wider block w-full">Undo</button></div>
    <nav class="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 pb-safe z-50 h-24 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="flex justify-between items-center h-16 max-w-lg mx-auto px-1 pt-2">
            <button id="nav-dashboard" onclick="router('dashboard')" class="nav-btn nav-active"><i class="fas fa-chart-pie mb-1"></i><span class="text-[9px] font-bold uppercase">Overview</span></button>
            <button id="nav-add-show" onclick="router('add-show')" class="nav-btn"><i class="fas fa-glasses mb-1"></i><span class="text-[9px] font-bold uppercase">Gig Log</span></button>
            <button id="nav-vendor" onclick="router('vendor')" class="nav-btn"><div class="bg-blue-600 rounded-full w-12 h-12 flex items-center justify-center shadow-lg shadow-blue-500/40 transform -translate-y-3 border-4 border-slate-900 relative z-20"><i class="fas fa-plus text-white text-xl"></i></div><span class="text-[9px] font-bold uppercase absolute -bottom-1 w-full text-center">Vendor</span></button>
            <button id="nav-tour-stock" onclick="router('tour-stock')" class="nav-btn"><i class="fas fa-bus mb-1"></i><span class="text-[9px] font-bold uppercase">Tour</span></button>
            <button id="nav-inventory" onclick="router('inventory')" class="nav-btn"><i class="fas fa-warehouse mb-1"></i><span class="text-[9px] font-bold uppercase">Home</span></button>
            <button id="nav-label" onclick="router('label')" class="nav-btn"><i class="fas fa-file-invoice mb-1"></i><span class="text-[9px] font-bold uppercase">Label</span></button>
        </div>
    </nav>
    <datalist id="currency-list">
        <option value="BRL">Brazilian Real (R$)</option><option value="CAD">Canadian Dollar ($)</option><option value="CHF">Swiss Franc (Fr)</option><option value="CLP">Chilean Peso ($)</option><option value="CNY">Chinese Yuan (¥)</option><option value="CZK">Czech Koruna (Kč)</option><option value="DKK">Danish Krone (kr)</option><option value="EUR">Euro (€)</option><option value="GBP">British Pound (£)</option><option value="GEL">Georgian Lari (₾)</option><option value="HKD">Hong Kong Dollar ($)</option><option value="HUF">Hungarian Forint (Ft)</option><option value="ILS">Israeli Shekel (₪)</option><option value="INR">Indian Rupee (₹)</option><option value="ISK">Icelandic Króna (kr)</option><option value="JPY">Japanese Yen (¥)</option><option value="KRW">South Korean Won (₩)</option><option value="MXN">Mexican Peso ($)</option><option value="NOK">Norwegian Krone (kr)</option><option value="PLN">Polish Zloty (zł)</option><option value="RON">Romanian Leu (lei)</option><option value="RSD">Serbian Dinar (дин)</option><option value="SEK">Swedish Krona (kr)</option><option value="THB">Thai Baht (฿)</option><option value="USD">US Dollar ($)</option>
    </datalist>
    <script>
        const DB_KEY = 'shai_maestro_merch_v11';
        
        // Suitcase capacity limits
        const SUITCASE_LIMITS = {
            vinyl: 40,  // Total vinyls (Guesthouse + Miniatures combined)
            cd: 100     // Total CDs (Guesthouse + Miniatures combined)
        };
        
        const ITEMS = [
            { id: 'guest_vinyl', label: 'GUESTHOUSE VINYL', icon: 'fa-record-vinyl', type: 'vinyl', color: 'text-indigo-400', bg: 'bg-indigo-400/10', border: 'border-indigo-500/30', lowThreshold: 60 },
            { id: 'guest_cd', label: 'GUESTHOUSE CD', icon: 'fa-compact-disc', type: 'cd', color: 'text-cyan-300', bg: 'bg-cyan-300/10', border: 'border-cyan-400/30', lowThreshold: 60 },
            { id: 'mini_vinyl', label: 'MINIATURES VINYL', icon: 'fa-record-vinyl', type: 'vinyl', color: 'text-purple-400', bg: 'bg-purple-400/10', border: 'border-purple-500/30', lowThreshold: 60 },
            { id: 'mini_cd', label: 'MINIATURES CD', icon: 'fa-compact-disc', type: 'cd', color: 'text-sky-300', bg: 'bg-sky-300/10', border: 'border-sky-400/30', lowThreshold: 60 },
            { id: 'postcards', label: 'POSTCARDS', icon: 'fa-image', type: 'merch', color: 'text-emerald-400', bg: 'bg-emerald-400/10', border: 'border-emerald-500/30', lowThreshold: 100 },
            { id: 'poster', label: 'POSTERS', icon: 'fa-scroll', type: 'merch', color: 'text-teal-400', bg: 'bg-teal-400/10', border: 'border-teal-500/30', lowThreshold: 30 },
            { id: 'tote', label: 'TOTE BAGS', icon: 'fa-shopping-bag', type: 'merch', color: 'text-green-400', bg: 'bg-green-400/10', border: 'border-green-500/30', lowThreshold: 30 }
        ];
        const TOUR_COLORS = [{ name: 'Purple', bg: 'bg-purple-900/40', border: 'border-purple-500', text: 'text-purple-400', line: 'bg-purple-500' }, { name: 'Blue', bg: 'bg-blue-900/40', border: 'border-blue-500', text: 'text-blue-400', line: 'bg-blue-500' }, { name: 'Emerald', bg: 'bg-emerald-900/40', border: 'border-emerald-500', text: 'text-emerald-400', line: 'bg-emerald-500' }, { name: 'Amber', bg: 'bg-amber-900/40', border: 'border-amber-500', text: 'text-amber-400', line: 'bg-amber-500' }, { name: 'Pink', bg: 'bg-pink-900/40', border: 'border-pink-500', text: 'text-pink-400', line: 'bg-pink-500' }, { name: 'Cyan', bg: 'bg-cyan-900/40', border: 'border-cyan-500', text: 'text-cyan-400', line: 'bg-cyan-500' }];
        let state = { shows: [], shipments: [], transfers: [], inventory: {}, settings: { designerPercent: 10, email: '', lastPrices: {}, notifiedLowStock: {} }, ui: { masterStockCollapsed: true, selectedOverviewTour: 'CURRENT', collapsedTours: {} }, vendorSession: { active: false, stock: {}, prices: {}, sales: [], meta: {} } };
        let tempShipmentItems = [], editingShipmentId = null, editingShowId = null, lastUndoAction = null, pendingVendorData = null, eurRates = { EUR: 1, USD: 1.1, GBP: 0.85, ILS: 4.0, CZK: 25.0, PLN: 4.3, AUD: 1.6, BRL: 5.5, CAD: 1.5, CLP: 980, CNY: 7.8, DKK: 7.5, GEL: 2.9, HKD: 8.5, HUF: 390, ISK: 150, INR: 90, JPY: 160, KRW: 1450, MXN: 19, NOK: 11.5, RON: 5.0, RSD: 117, SEK: 11.3, CHF: 0.95, THB: 39 };
        let lastLabelSelection = ITEMS[0].id;

        const loadData = () => {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) { try { const parsed = JSON.parse(saved); state = { ...state, ...parsed }; if (!state.vendorSession.meta) state.vendorSession.meta = {}; if (!state.ui.collapsedTours) state.ui.collapsedTours={}; } catch(e) {} }
            ITEMS.forEach(item => { if (state.inventory[item.id] === undefined) state.inventory[item.id] = 0; });
            fetch('https://api.exchangerate-api.com/v4/latest/EUR').then(res => res.json()).then(data => { eurRates = data.rates; window.renderDashboard(); }).catch(e => {});
            if ("Notification" in window) Notification.requestPermission();
        };
        const saveData = () => { localStorage.setItem(DB_KEY, JSON.stringify(state)); checkLowStock(); };
        const checkLowStock = () => { /* Logic */ };
        const showToast = (msg, icon='fa-check-circle') => { const t = document.getElementById('toast'); document.getElementById('toastMsg').innerText = msg; document.getElementById('toastIcon').className = `fas ${icon} text-xl`; t.className = "show"; setTimeout(() => t.className = "", 4000); };
        const setUndo = (type, data, msg="Action Saved") => { lastUndoAction = { type, data }; showToast(msg); };
        const handleUndo = () => { if(!lastUndoAction) return; if(lastUndoAction.type==='add_show') state.shows.pop(); else if(lastUndoAction.type==='add_shipment') state.shipments.pop(); else if(lastUndoAction.type==='transfer') state.transfers.pop(); saveData(); location.reload(); };
        const getStockLevels = (itemId) => { let home = state.inventory[itemId] || 0, tour = 0; state.shipments.forEach(s => s.items.forEach(i => { if (i.itemId === itemId) home += (parseInt(i.qty)||0); })); state.transfers.forEach(t => { const qty = t.items[itemId]||0; if (t.type === 'TO_TOUR') { home -= qty; tour += qty; } else if (t.type === 'TO_HOME') { tour -= qty; home += qty; } }); state.shows.forEach(s => { if (s.sales?.[itemId]) tour -= (parseInt(s.sales[itemId].qty)||0); if (s.freebies?.[itemId]) tour -= (parseInt(s.freebies[itemId])||0); }); return { home, tour }; };
        const getItem = (id) => ITEMS.find(i => i.id === id) || {};
        
        // Get current tour stock totals by type
        const getTourCapacity = () => {
            let vinylOnTour = 0, cdOnTour = 0;
            ITEMS.forEach(item => {
                const levels = getStockLevels(item.id);
                if (item.type === 'vinyl') vinylOnTour += levels.tour;
                else if (item.type === 'cd') cdOnTour += levels.tour;
            });
            return { 
                vinyl: vinylOnTour, 
                cd: cdOnTour, 
                vinylMax: SUITCASE_LIMITS.vinyl, 
                cdMax: SUITCASE_LIMITS.cd,
                vinylPct: Math.min(100, Math.round((vinylOnTour / SUITCASE_LIMITS.vinyl) * 100)),
                cdPct: Math.min(100, Math.round((cdOnTour / SUITCASE_LIMITS.cd) * 100)),
                vinylOver: vinylOnTour > SUITCASE_LIMITS.vinyl,
                cdOver: cdOnTour > SUITCASE_LIMITS.cd
            };
        };

        window.renderDashboard = () => {
            const container = document.getElementById('view-dashboard');
            const uniqueTours = [...new Set(state.shows.map(s => s.tour).filter(Boolean))].reverse();
            const selectedTour = state.ui.selectedOverviewTour === 'CURRENT' ? (uniqueTours[0] || "") : state.ui.selectedOverviewTour;
            let yearly = { net: 0, cash: 0, card: 0, paypal: 0, shani: 0 }, tour = { net: 0, cash: 0, card: 0, paypal: 0, shani: 0 }, totalExpenses = 0;
            state.shows.forEach(show => {
                const rate = show.currency === 'EUR' ? 1 : (eurRates[show.currency] ? (1/eurRates[show.currency]) : 1);
                let showGross = 0, merchGross = 0;
                ITEMS.forEach(item => { const sale = show.sales?.[item.id]; if(sale && sale.qty > 0) { const amt = sale.qty*sale.price; showGross+=amt; if(item.type==='merch') merchGross+=amt; }});
                const venueCut = showGross * ((show.venuePercent||0)/100);
                const merchNet = merchGross * (1 - ((show.venuePercent||0)/100)); 
                const designerCut = merchNet * ((state.settings.designerPercent||0)/100);
                const net = showGross - venueCut - designerCut;
                const netEur = net * rate; const designerEur = designerCut * rate;
                yearly.net += netEur; yearly.shani += designerEur;
                const pm = show.paymentMethods || { cash: net, card: 0, paypal: 0 };
                const collectedTotal = (pm.cash + pm.card + pm.paypal) || net; 
                const scale = collectedTotal > 0 ? (net / collectedTotal) : 0; 
                const cEur = (pm.cash * scale) * rate; const ccEur = (pm.card * scale) * rate; const ppEur = (pm.paypal * scale) * rate;
                yearly.cash += cEur; yearly.card += ccEur; yearly.paypal += ppEur;
                if (show.tour === selectedTour) { tour.net += netEur; tour.shani += designerEur; tour.cash += cEur; tour.card += ccEur; tour.paypal += ppEur; }
            });
            state.shipments.forEach(s => { let c = parseFloat(s.shipping)||0; s.items.forEach(i=>c+=(i.qty*i.cost)); totalExpenses += c; });
            yearly.net -= totalExpenses;
            const getBreakdownHtml = (obj) => `<div class="flex gap-3 text-[10px] font-bold text-slate-400 mt-2 bg-slate-900/50 px-3 py-2 rounded-lg border border-slate-700/50"><div><span class="text-green-400">Cash:</span> €${Math.round(obj.cash).toLocaleString()}</div><div><span class="text-blue-400">Card:</span> €${Math.round(obj.card).toLocaleString()}</div><div><span class="text-indigo-400">PP:</span> €${Math.round(obj.paypal).toLocaleString()}</div></div>`;
            const groupedShows = []; let currentGroup = null;
            [...state.shows].reverse().forEach(show => { const tourName = show.tour || "Individual Gig"; if (!currentGroup || currentGroup.tourName !== tourName || tourName === "Individual Gig") { currentGroup = { tourName: tourName, shows: [] }; groupedShows.push(currentGroup); } currentGroup.shows.push(show); });
            const activityHtml = groupedShows.map((group, groupIdx) => {
                const isIndiv = group.tourName === "Individual Gig";
                const colorIdx = group.tourName.split('').reduce((a,b)=>a+b.charCodeAt(0),0) % TOUR_COLORS.length;
                const theme = isIndiv ? { border: 'border-slate-700', text: 'text-slate-400', bg: 'bg-slate-800', line: 'hidden' } : TOUR_COLORS[colorIdx];
                if (isIndiv) { const s = group.shows[0]; return `<div onclick="openGigModal(${s.id})" class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center active:scale-95 transition-transform cursor-pointer hover:border-blue-500/50 group shadow-lg mb-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-400">${s.city.substring(0,2).toUpperCase()}</div><div class="text-left"><h3 class="font-bold text-white text-base leading-none mb-1">${s.city}</h3><p class="text-xs text-slate-400 font-bold">${s.venue}</p></div></div><div class="text-right"><span class="block text-[10px] font-bold text-slate-500 bg-slate-900/50 px-2 py-0.5 rounded-full mb-1 inline-block">Single Gig</span><span class="block text-[10px] text-slate-500 font-mono font-bold">${s.date}</span></div></div>`; } 
                else {
                    const isCollapsed = state.ui.collapsedTours[group.tourName];
                    let tourTotalNet = 0;
                    group.shows.forEach(s => { let g=0, m=0; ITEMS.forEach(i=>{ const x=s.sales?.[i.id]; if(x){const a=x.qty*x.price; g+=a; if(i.type==='merch')m+=a;} }); const n = g - (g*(s.venuePercent||0)/100) - (m*(1-(s.venuePercent||0)/100)*((state.settings.designerPercent||0)/100)); tourTotalNet += n * (s.currency==='EUR'?1:(eurRates[s.currency]?(1/eurRates[s.currency]):1)); });
                    const headerHtml = `<div onclick="toggleTourCollapse('${group.tourName}')" class="tour-header relative z-20 ${theme.bg} border-l-4 ${theme.border} p-3 rounded-r-xl mb-2 flex justify-between items-center shadow-md"><div><h3 class="text-xs font-black uppercase ${theme.text} tracking-widest flex items-center gap-2"><i class="fas ${isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down'}"></i> ${group.tourName}</h3><p class="text-[9px] text-slate-300 font-bold mt-1">${group.shows.length} Gigs • ${group.shows[group.shows.length-1].date} - ${group.shows[0].date}</p></div><div class="text-right"><span class="block text-sm font-extrabold text-white">€${Math.round(tourTotalNet).toLocaleString()}</span><span class="text-[9px] text-slate-400 uppercase font-bold">Total Net</span></div></div>`;
                    if (isCollapsed) return headerHtml;

der-l-4 border-green-500"><h3 class="text-xs font-bold text-green-500 uppercase tracking-widest flex items-center gap-2"><i class="fas fa-file-excel"></i> Export Data</h3><div class="grid grid-cols-2 gap-3"><button onclick="exportCSV('ALL')" class="btn-secondary py-3 text-xs bg-slate-700">All Year CSV</button><button onclick="exportPDF()" class="btn-secondary py-3 text-xs bg-red-600 hover:bg-red-500">Backup to PDF</button></div></div><div class="pt-10 pb-10"><button onclick="if(confirm('Wipe all data?')) { localStorage.removeItem(DB_KEY); location.reload(); }" class="text-red-500/50 text-xs w-full text-center hover:text-red-500 hover:underline font-bold uppercase tracking-widest">Reset App Data</button></div></div>`;

            document.getElementById('transferFormContainer').classList.add('hidden'); f.reset(); 
            window.renderTourStock(); 
            if(t === 'TO_TOUR') showToast("Bus Loaded! 👍", "fa-thumbs-up"); else showToast("Bus Unloaded", "fa-check"); 
        };
        
        window.updateInitialStock = (id, val) => { state.inventory[id] = parseInt(val)||0; saveData(); document.getElementById(`homeVal_${id}`).innerText = getStockLevels(id).home; };
        window.toggleMasterStock = (c) => { state.ui.masterStockCollapsed = c; saveData(); window.renderInventory(); };
        window.updateSetting = (k, v) => { state.settings[k] = k==='designerPercent'?parseFloat(v):v; saveData(); showToast('Settings Updated'); };
        window.updateOverviewTour = (v) => { state.ui.selectedOverviewTour = v; window.renderDashboard(); saveData(); };
        window.exportCSV = (t) => { let data = []; const headers = ["Date", "Tour", "City", "Venue", "Currency", "Gross", "Venue Cut", "Net", "Designer Cut", "Take Home (Local)", "Take Home (EUR)"]; let source = state.shows; let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\r\n"; source.forEach(show => { let showGross = 0; ITEMS.forEach(item => { const sale = show.sales?.[item.id]; if(sale && sale.qty > 0) showGross += (sale.qty * sale.price); }); const net = showGross * (1 - ((show.venuePercent||0)/100)); const takeHome = net * (1 - ((state.settings.designerPercent||0)/100)); let row = [show.date, `"${show.tour}"`, `"${show.city}"`, `"${show.venue}"`, show.currency, showGross.toFixed(2), "", net.toFixed(2), "", takeHome.toFixed(2), ""]; csvContent += row.join(",") + "\r\n"; }); const encodedUri = encodeURI(csvContent); const link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", "merch.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link); };
        window.exportPDF = () => { const { jsPDF } = window.jspdf; const doc = new jsPDF(); doc.setFontSize(18); doc.text("Shai Maestro Merch Backup", 10, 10); doc.setFontSize(10); let y = 20; doc.text(`Total Shows: ${state.shows.length}`, 10, y+=10); doc.text(`Current Stock (Warehouse):`, 10, y+=10); ITEMS.forEach(i => { doc.text(`- ${i.label}: ${state.inventory[i.id]}`, 15, y+=6); }); doc.save("merch_backup.pdf"); };
        
        window.addTempItem = () => { const select = document.getElementById('shp_temp_itemId'); const qty=parseInt(document.getElementById('shp_temp_qty').value), cost=parseFloat(document.getElementById('shp_temp_cost').value); if(!qty||isNaN(cost))return alert("Enter Qty/Cost"); tempShipmentItems.push({itemId:select.value, qty, cost}); lastLabelSelection = select.value; document.getElementById('shp_temp_qty').value=''; document.getElementById('shp_temp_cost').value=''; window.renderLabel(); };
        window.removeTempItem = (i) => { tempShipmentItems.splice(i,1); window.renderLabel(); };
        window.saveShipment = () => { if(!tempShipmentItems.length)return alert("No items"); const d = { id:editingShipmentId||Date.now(), date:document.getElementById('shp_date').value, invoice:document.getElementById('shp_invoice').value, shipping:parseFloat(document.getElementById('shp_shipping').value)||0, paid:document.getElementById('shp_paid').checked, paidDate:document.getElementById('shp_paidDate').value, items:tempShipmentItems }; if(editingShipmentId) { state.shipments[state.shipments.findIndex(s=>s.id===editingShipmentId)]=d; editingShipmentId=null;} else { state.shipments.push(d); setUndo('add_shipment', d); } saveData(); window.resetShipmentForm(); };
        window.openShipmentModal = (id) => { const s=state.shipments.find(s=>s.id===id); const b=document.getElementById('modalBody'); const f=document.getElementById('modalFooter'); document.getElementById('modalTitle').innerText="Shipment Details"; b.innerHTML=`<div class="space-y-2"><p class="text-slate-400 text-xs uppercase font-bold">Inv: ${s.invoice}</p><div class="bg-slate-900/50 p-2 rounded">${s.items.map(i=>`<div>${getItem(i.itemId).label} x${i.qty}</div>`).join('')}</div></div>`; f.innerHTML = `<button onclick="closeModal(); editShipment(${id})" class="btn-primary py-2 text-sm">Edit</button>`; document.getElementById('modalOverlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('modalContent').classList.remove('opacity-0','scale-95'),10); };
        window.editShipment = (id) => { editingShipmentId = id; tempShipmentItems = [...state.shipments.find(s=>s.id===id).items]; window.router('label'); };
        window.closeModal = () => { document.getElementById('modalContent').classList.add('opacity-0', 'scale-95'); setTimeout(()=>document.getElementById('modalOverlay').classList.add('hidden'),200); };
        window.togglePaidDate = (c) => { document.getElementById('shp_paidDate').classList.toggle('hidden', !c); };
        window.resetShipmentForm = () => { editingShipmentId=null; tempShipmentItems=[]; window.renderLabel(); };
        window.updateCurrencyLabels = (val) => { let symbol = '€'; const v = val.toUpperCase(); if(['USD','CAD','AUD'].includes(v)) symbol = '$'; else if(v === 'GBP') symbol = '£'; else if(v === 'ILS') symbol = '₪'; else if(v === 'CZK') symbol = 'Kč'; else if(v === 'PLN') symbol = 'zł'; document.querySelectorAll('.currency-label').forEach(el => el.innerText = symbol); };

        loadData(); window.router('dashboard');
    </script>
</body>
</html>
