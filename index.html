    <script>
const DB_KEY='shai_maestro_merch_v12';
const OLD_DB_KEY='shai_maestro_merch_v11';
const SUITCASE_LIMITS={vinyl:40,cd:100};
const CURRENCIES=[{code:'EUR',symbol:'€',name:'Euro'},{code:'GBP',symbol:'£',name:'British Pound'},{code:'USD',symbol:'$',name:'US Dollar'},{code:'CHF',symbol:'Fr',name:'Swiss Franc'},{code:'CZK',symbol:'Kč',name:'Czech Koruna'},{code:'DKK',symbol:'kr',name:'Danish Krone'},{code:'HUF',symbol:'Ft',name:'Hungarian Forint'},{code:'ISK',symbol:'kr',name:'Icelandic Króna'},{code:'NOK',symbol:'kr',name:'Norwegian Krone'},{code:'PLN',symbol:'zł',name:'Polish Zloty'},{code:'RON',symbol:'lei',name:'Romanian Leu'},{code:'RSD',symbol:'дин',name:'Serbian Dinar'},{code:'SEK',symbol:'kr',name:'Swedish Krona'},{code:'GEL',symbol:'₾',name:'Georgian Lari'},{code:'ILS',symbol:'₪',name:'Israeli Shekel'},{code:'CAD',symbol:'$',name:'Canadian Dollar'},{code:'BRL',symbol:'R$',name:'Brazilian Real'},{code:'JPY',symbol:'¥',name:'Japanese Yen'},{code:'KRW',symbol:'₩',name:'S. Korean Won'},{code:'INR',symbol:'₹',name:'Indian Rupee'},{code:'HKD',symbol:'$',name:'Hong Kong Dollar'},{code:'MXN',symbol:'$',name:'Mexican Peso'},{code:'THB',symbol:'฿',name:'Thai Baht'},{code:'CNY',symbol:'¥',name:'Chinese Yuan'},{code:'CLP',symbol:'$',name:'Chilean Peso'}];
const getSym=(c)=>{const f=CURRENCIES.find(x=>x.code===c);return f?f.symbol:c;};
const curOpts=(sel)=>CURRENCIES.map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${c.code} — ${c.symbol} ${c.name}</option>`).join('');

// Items (component items - tracked in inventory)
const ITEMS=[
    {id:'guest_vinyl',label:'GUESTHOUSE VINYL',shortLabel:'GH VINYL',icon:'fa-record-vinyl',type:'vinyl',color:'text-indigo-400',bg:'bg-indigo-400/10',border:'border-indigo-500/30',lowThreshold:60},
    {id:'guest_cd',label:'GUESTHOUSE CD',shortLabel:'GH CD',icon:'fa-compact-disc',type:'cd',color:'text-cyan-300',bg:'bg-cyan-300/10',border:'border-cyan-400/30',lowThreshold:60},
    {id:'mini_vinyl',label:'MINIATURES VINYL',shortLabel:'MINI VINYL',icon:'fa-record-vinyl',type:'vinyl',color:'text-purple-400',bg:'bg-purple-400/10',border:'border-purple-500/30',lowThreshold:60},
    {id:'poster',label:'POSTERS',shortLabel:'POSTER',icon:'fa-scroll',type:'merch',color:'text-teal-400',bg:'bg-teal-400/10',border:'border-teal-500/30',lowThreshold:30}
];

// Bundles - composite items that decompose into components on save
// Each bundle defines which component items it decrements when sold
const BUNDLES=[
    {id:'bundle_vinyl_cd',label:'VINYL + CD',shortLabel:'V+CD',icon:'fa-layer-group',color:'text-amber-300',bg:'bg-amber-400/10',border:'border-amber-500/40',components:['guest_vinyl','guest_cd']},
    {id:'bundle_vinyl_poster',label:'VINYL + POSTER',shortLabel:'V+POS',icon:'fa-layer-group',color:'text-rose-300',bg:'bg-rose-400/10',border:'border-rose-500/40',components:['guest_vinyl','poster']},
    {id:'bundle_cd_poster',label:'CD + POSTER',shortLabel:'CD+POS',icon:'fa-layer-group',color:'text-lime-300',bg:'bg-lime-400/10',border:'border-lime-500/40',components:['guest_cd','poster']}
];

// All sellable line items (for vendor mode, gig form, etc)
const ALL_SELLABLE=[...ITEMS, ...BUNDLES];

const TC=[{bg:'bg-purple-900/40',border:'border-purple-500',text:'text-purple-400',line:'bg-purple-500'},{bg:'bg-blue-900/40',border:'border-blue-500',text:'text-blue-400',line:'bg-blue-500'},{bg:'bg-emerald-900/40',border:'border-emerald-500',text:'text-emerald-400',line:'bg-emerald-500'},{bg:'bg-amber-900/40',border:'border-amber-500',text:'text-amber-400',line:'bg-amber-500'},{bg:'bg-pink-900/40',border:'border-pink-500',text:'text-pink-400',line:'bg-pink-500'},{bg:'bg-cyan-900/40',border:'border-cyan-500',text:'text-cyan-400',line:'bg-cyan-500'}];

let state={shows:[],shipments:[],transfers:[],inventory:{},settings:{email:'',lastPrices:{},notifiedLowStock:{},dataVersion:12,migrationDone:false},ui:{masterStockCollapsed:true,selectedOverviewTour:'CURRENT',collapsedTours:{}},vendorSession:{active:false,stock:{},prices:{},sales:[],meta:{}}};

let tempShipmentItems=[],editingShipmentId=null,editingShowId=null,lastUndoAction=null,pendingVendorData=null;
let eurRates={EUR:1,USD:1.1,GBP:0.85,ILS:4.0,CZK:25.0,PLN:4.3,BRL:5.5,CAD:1.5,CLP:980,CNY:7.8,DKK:7.5,GEL:2.9,HKD:8.5,HUF:390,ISK:150,INR:90,JPY:160,KRW:1450,MXN:19,NOK:11.5,RON:5.0,RSD:117,SEK:11.3,CHF:0.95,THB:39};
let ratesUpdatedAt=null;
let lastLabelSelection=ITEMS[0].id;

// =============== MIGRATION FROM v11 ===============
// Strategy: keep historical data but redistribute removed items into bundles.
// - postcards -> bundle_vinyl_poster
// - tote      -> bundle_cd_poster
// - mini_cd   -> deleted (noise)
// - designerPercent -> removed
const MIGRATION_MAP = {
    'postcards': 'bundle_vinyl_poster',
    'tote': 'bundle_cd_poster',
    'mini_cd': null  // delete
};

const migrateFromV11=(oldData)=>{
    const newData = JSON.parse(JSON.stringify(oldData));
    let migrationLog = {gigsTouched: 0, postcardSales: 0, toteSales: 0, miniCdSales: 0, postcardsRedirected: 0, totesRedirected: 0};

    // Migrate shows: remap sales and freebies keys
    if (newData.shows) {
        newData.shows.forEach(show => {
            let touched = false;
            if (show.sales) {
                const newSales = {};
                Object.entries(show.sales).forEach(([key, val]) => {
                    if (key === 'mini_cd') {
                        migrationLog.miniCdSales += (val.qty || 0);
                        touched = true;
                        return; // skip - delete
                    }
                    const targetKey = MIGRATION_MAP.hasOwnProperty(key) ? MIGRATION_MAP[key] : key;
                    if (targetKey === null) return;
                    if (key === 'postcards') { migrationLog.postcardSales += (val.qty||0); migrationLog.postcardsRedirected++; touched = true; }
                    if (key === 'tote') { migrationLog.toteSales += (val.qty||0); migrationLog.totesRedirected++; touched = true; }
                    // If target already has data (rare), merge by summing qty and keeping max price
                    if (newSales[targetKey]) {
                        newSales[targetKey] = {qty: newSales[targetKey].qty + val.qty, price: Math.max(newSales[targetKey].price, val.price)};
                    } else {
                        newSales[targetKey] = {qty: val.qty, price: val.price};
                    }
                });
                show.sales = newSales;
            }
            if (show.freebies) {
                const newFree = {};
                Object.entries(show.freebies).forEach(([key, qty]) => {
                    if (key === 'mini_cd') return;
                    const targetKey = MIGRATION_MAP.hasOwnProperty(key) ? MIGRATION_MAP[key] : key;
                    if (targetKey === null) return;
                    newFree[targetKey] = (newFree[targetKey] || 0) + qty;
                });
                show.freebies = newFree;
            }
            if (touched) migrationLog.gigsTouched++;
        });
    }

    // Migrate shipments: drop line items for removed component items (postcards/tote/mini_cd were tracked at component level)
    // Keep shipment line items for postcards/tote since they were physically shipped — but they're no longer in our item list.
    // Decision: drop them since we have no inventory category for them. User said "focus on the future".
    if (newData.shipments) {
        newData.shipments.forEach(ship => {
            if (ship.items) {
                ship.items = ship.items.filter(i => !['postcards','tote','mini_cd'].includes(i.itemId));
            }
        });
    }

    // Migrate transfers: drop transferred quantities of removed items
    if (newData.transfers) {
        newData.transfers.forEach(tr => {
            if (tr.items) {
                ['postcards','tote','mini_cd'].forEach(k => delete tr.items[k]);
            }
        });
    }

    // Migrate inventory: drop removed items
    if (newData.inventory) {
        ['postcards','tote','mini_cd'].forEach(k => delete newData.inventory[k]);
    }

    // Settings: remove designerPercent
    if (newData.settings) {
        delete newData.settings.designerPercent;
        delete newData.settings.notifiedLowStock; // reset alerts
        newData.settings.dataVersion = 12;
        newData.settings.migrationDone = true;
    }

    // Last prices: drop removed items from price memory
    if (newData.settings && newData.settings.lastPrices) {
        ['postcards','tote','mini_cd'].forEach(k => delete newData.settings.lastPrices[k]);
    }

    return {data: newData, log: migrationLog};
};

const loadData=()=>{
    const savedV12 = localStorage.getItem(DB_KEY);
    const savedV11 = localStorage.getItem(OLD_DB_KEY);

    if (savedV12) {
        try {
            const p = JSON.parse(savedV12);
            state = {...state, ...p};
            if (!state.vendorSession.meta) state.vendorSession.meta = {};
            if (!state.ui.collapsedTours) state.ui.collapsedTours = {};
        } catch(e) { console.error('v12 parse fail', e); }
    } else if (savedV11) {
        // Run migration
        try {
            const oldData = JSON.parse(savedV11);
            const {data: newData, log} = migrateFromV11(oldData);
            state = {...state, ...newData};
            if (!state.vendorSession.meta) state.vendorSession.meta = {};
            if (!state.ui.collapsedTours) state.ui.collapsedTours = {};
            saveData();
            // Show migration summary on first load
            setTimeout(() => {
                const summary = `Migration complete:\n\n• ${log.gigsTouched} gig(s) updated\n• ${log.postcardSales} postcard sales → Vinyl+Poster bundles\n• ${log.toteSales} tote sales → CD+Poster bundles\n• ${log.miniCdSales} mini-CD sales removed (noise)\n\nDesigner cut removed.\nStock will recalculate from actual bundle decomposition.\n\nYour v11 data is preserved as a backup.`;
                alert(summary);
            }, 500);
        } catch(e) { console.error('migration fail', e); alert('Migration failed: ' + e.message); }
    }

    // Ensure all current items have inventory keys
    ITEMS.forEach(item => {
        if (state.inventory[item.id] === undefined) state.inventory[item.id] = 0;
    });

    // Fetch live exchange rates with caching + multi-API fallback
    fetchExchangeRates();
};

// Rate fetching strategy:
// 1. Load cached rates from localStorage immediately (so we never start with stale hardcoded values if we've ever succeeded before)
// 2. Try Frankfurter (ECB-backed, no key, very reliable, CORS-friendly)
// 3. Fallback to exchangerate-api.com
// 4. If both fail, keep whatever we loaded from cache (or hardcoded if first run)
const RATES_CACHE_KEY = 'shai_eur_rates_cache_v1';

const loadCachedRates = () => {
    try {
        const cached = localStorage.getItem(RATES_CACHE_KEY);
        if (!cached) return false;
        const {rates, timestamp} = JSON.parse(cached);
        if (rates && Object.keys(rates).length > 5) {
            eurRates = rates;
            ratesUpdatedAt = new Date(timestamp);
            return true;
        }
    } catch(e) {}
    return false;
};

const saveCachedRates = () => {
    try {
        localStorage.setItem(RATES_CACHE_KEY, JSON.stringify({rates: eurRates, timestamp: Date.now()}));
    } catch(e) {}
};

const fetchExchangeRates = async () => {
    // Step 1: load cache so dashboard renders immediately with the freshest rates we have
    loadCachedRates();

    // Step 2-3: try APIs in order
    const sources = [
        // Frankfurter: ECB-published rates, no key, CORS-friendly, very reliable
        {name: 'Frankfurter', url: 'https://api.frankfurter.app/latest?from=EUR', parse: d => ({...d.rates, EUR: 1})},
        // Backup
        {name: 'exchangerate-api', url: 'https://api.exchangerate-api.com/v4/latest/EUR', parse: d => d.rates}
    ];

    for (const src of sources) {
        try {
            const r = await fetch(src.url);
            if (!r.ok) continue;
            const data = await r.json();
            const parsed = src.parse(data);
            if (parsed && Object.keys(parsed).length > 5) {
                eurRates = parsed;
                ratesUpdatedAt = new Date();
                saveCachedRates();
                if (window.renderDashboard) window.renderDashboard();
                return;
            }
        } catch(e) {
            // Silently fail - we have cached or fallback rates
        }
    }
    // Both APIs failed - keep whatever we have (cached or hardcoded). No console output.
};

const saveData=()=>{localStorage.setItem(DB_KEY,JSON.stringify(state));};

const showToast=(msg,icon='fa-check-circle')=>{const t=document.getElementById('toast');document.getElementById('toastMsg').innerText=msg;document.getElementById('toastIcon').className=`fas ${icon} text-xl`;t.className="show";setTimeout(()=>t.className="",4000);};
const setUndo=(type,data)=>{lastUndoAction={type,data};showToast("Action Saved");};
const handleUndo=()=>{if(!lastUndoAction)return;if(lastUndoAction.type==='add_show')state.shows.pop();else if(lastUndoAction.type==='add_shipment')state.shipments.pop();else if(lastUndoAction.type==='transfer')state.transfers.pop();saveData();location.reload();};

// Get item OR bundle definition
const getSellable = (id) => ALL_SELLABLE.find(x => x.id === id) || {};
const getItem = (id) => ITEMS.find(i => i.id === id) || {};
const isBundle = (id) => BUNDLES.some(b => b.id === id);

// Calculate stock levels - bundles decrement their components
const getStockLevels=(itemId)=>{
    let home=state.inventory[itemId]||0, tour=0;
    state.shipments.forEach(s=>s.items.forEach(i=>{if(i.itemId===itemId)home+=(parseInt(i.qty)||0);}));
    state.transfers.forEach(t=>{const qty=t.items[itemId]||0;if(t.type==='TO_TOUR'){home-=qty;tour+=qty;}else{tour-=qty;home+=qty;}});
    state.shows.forEach(s=>{
        // Direct sales of this component
        if(s.sales?.[itemId]) tour-=(parseInt(s.sales[itemId].qty)||0);
        if(s.freebies?.[itemId]) tour-=(parseInt(s.freebies[itemId])||0);
        // Bundle sales that include this component
        BUNDLES.forEach(bundle => {
            if (bundle.components.includes(itemId)) {
                if (s.sales?.[bundle.id]) tour -= (parseInt(s.sales[bundle.id].qty)||0);
                if (s.freebies?.[bundle.id]) tour -= (parseInt(s.freebies[bundle.id])||0);
            }
        });
    });
    return{home,tour};
};

const getTourCap=()=>{
    let v=0,c=0;
    ITEMS.forEach(i=>{
        const l=getStockLevels(i.id);
        if(i.type==='vinyl')v+=l.tour;
        else if(i.type==='cd')c+=l.tour;
    });
    return{vinyl:v,cd:c,vMax:SUITCASE_LIMITS.vinyl,cMax:SUITCASE_LIMITS.cd,vPct:Math.min(100,Math.round(v/SUITCASE_LIMITS.vinyl*100)),cPct:Math.min(100,Math.round(c/SUITCASE_LIMITS.cd*100)),vOver:v>SUITCASE_LIMITS.vinyl,cOver:c>SUITCASE_LIMITS.cd};
};

// Calculate net for a show. Venue cut can be % or fixed amount.
const calcNet=(s)=>{
    let g=0;
    ALL_SELLABLE.forEach(i=>{
        const x=s.sales?.[i.id];
        if(x&&x.qty>0) g+=(x.qty*x.price);
    });
    let venueCut = 0;
    if (s.venueCutType === 'amount') {
        venueCut = parseFloat(s.venueCutAmount) || 0;
    } else {
        venueCut = g * ((s.venuePercent||0) / 100);
    }
    return g - venueCut;
};

const calcGross=(s)=>{
    let g=0;
    ALL_SELLABLE.forEach(i=>{
        const x=s.sales?.[i.id];
        if(x&&x.qty>0) g+=(x.qty*x.price);
    });
    return g;
};

const calcVenueCut=(s)=>{
    if (s.venueCutType === 'amount') return parseFloat(s.venueCutAmount) || 0;
    return calcGross(s) * ((s.venuePercent||0) / 100);
};

const toEUR = (amount, currency) => {
    if (currency === 'EUR') return amount;
    return amount * (eurRates[currency] ? (1/eurRates[currency]) : 1);
};

window.recSale=(id,p,m)=>{closeModal();state.vendorSession.sales.push({timestamp:Date.now(),itemId:id,price:p,method:m});saveData();window.renderVendor();showToast(`${m} Sale Recorded`,'fa-dollar-sign');};
window.undoVendorSale=()=>{if(!state.vendorSession.sales.length)return showToast("Nothing to undo","fa-ban");state.vendorSession.sales.pop();saveData();window.renderVendor();showToast("Undone","fa-undo");};

window.finishVendor=()=>{
    const sales=state.vendorSession.sales,agg={};
    let cash=0,card=0,pp=0;
    sales.forEach(s=>{
        if(s.method==='Cash')cash+=s.price;
        else if(s.method==='Card')card+=s.price;
        else pp+=s.price;
        agg[s.itemId]=(agg[s.itemId]||{qty:0,price:state.vendorSession.prices[s.itemId]});
        agg[s.itemId].qty++;
    });
    pendingVendorData={meta:state.vendorSession.meta,sales:agg,payments:{cash,card,paypal:pp}};
    state.vendorSession={active:false,stock:{},prices:{},sales:[],meta:{}};
    saveData();
    editingShowId=null;
    router('add-show');
    setTimeout(()=>alert("Vendor Sale Finished! Review and Save."),300);
};

const fireConfetti=()=>{const canvas=document.getElementById('confetti-canvas'),ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const p=[];for(let i=0;i<100;i++)p.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,vx:Math.random()*4-2,vy:Math.random()*5+5,color:`hsl(${Math.random()*360},70%,50%)`,size:Math.random()*8+4});const a=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);let act=false;p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);if(p.y<canvas.height)act=true;});if(act)requestAnimationFrame(a);else ctx.clearRect(0,0,canvas.width,canvas.height);};a();};

window.submitShow=(e)=>{
    e.preventDefault();
    const f=e.target;
    let tn=f.tourSelect.value;
    if(tn==='NEW')tn=f.newTour.value.trim();
    if(!tn)tn="Individual Gig";
    const cutType = f.venueCutType.value || 'percent';
    const sd={
        id:editingShowId||Date.now(),
        tour:tn,
        city:f.city.value,
        venue:f.venue.value,
        date:f.date.value,
        currency:f.currency.value||'EUR',
        venueCutType: cutType,
        venuePercent: cutType==='percent' ? (parseFloat(f.venuePercent.value)||0) : 0,
        venueCutAmount: cutType==='amount' ? (parseFloat(f.venueCutAmount.value)||0) : 0,
        sales:{},freebies:{},
        paymentMethods:{
            cash:parseFloat(f.pay_cash.value)||0,
            card:parseFloat(f.pay_card.value)||0,
            paypal:parseFloat(f.pay_paypal.value)||0
        }
    };
    ALL_SELLABLE.forEach(i=>{
        const q=parseInt(f[`qty_${i.id}`].value)||0;
        const p=parseFloat(f[`price_${i.id}`].value)||0;
        if(q>0)sd.sales[i.id]={qty:q,price:p};
        if(p>0&&!editingShowId)state.settings.lastPrices[i.id]=p;
        const fr=parseInt(f[`free_${i.id}`].value)||0;
        if(fr>0)sd.freebies[i.id]=fr;
    });
    if(editingShowId){
        state.shows[state.shows.findIndex(s=>s.id===editingShowId)]=sd;
        editingShowId=null;
    } else {
        state.shows.push(sd);
        setUndo('add_show',sd);
        fireConfetti();
    }
    pendingVendorData=null;
    saveData();
    f.reset();
    window.router('dashboard');
    showToast("Saved!","fa-thumbs-up");
};

window.exportJSON = () => {
    const payload = {
        _meta: {
            exportedAt: new Date().toISOString(),
            version: 12,
            app: 'shai_maestro_merch'
        },
        ...state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `shai_merch_backup_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);

    document.body.removeChild(a);

    if (window._yearEndState) { window._yearEndState.jsonBackedUp = true; window.renderYearEndModal(); }

window.openYearEndResetFlow = (autoPrompt) => {
    const currentYear = new Date().getFullYear();
    const yearsInData = [...new Set(state.shows.map(s => (s.date||'').substring(0,4)).filter(Boolean))].sort();
    const oldestYear = yearsInData[0] || currentYear;
    const newestYear = yearsInData[yearsInData.length-1] || currentYear;

    window._yearEndState = {
        excelBackedUp: false,

        autoPrompt: !!autoPrompt,
        showCount: state.shows.length,
        shipmentCount: state.shipments.length,
        oldestYear,
        newestYear

    window.renderYearEndModal();
};

window.confirmYearEndReset = () => {
    if (!window._yearEndState || !window._yearEndState.excelBackedUp || !window._yearEndState.jsonBackedUp) return;
    if (!confirm('FINAL CONFIRMATION:\n\nDelete all shows, shipments, transfers, and freebies?\n\nInventory will be preserved.\n\nThis cannot be undone.')) return;

    // Preserve inventory (current physical home stock - what's in the warehouse right now)
    // Recalculate "true" home stock by taking current home levels (with all the historical math) and locking those in as new starting inventory
    const newInventory = {};
    ITEMS.forEach(i => {
        const l = getStockLevels(i.id);
        // Preserve home stock as new initial. Tour stock gets reset to zero (you should unload bus first anyway).
        newInventory[i.id] = Math.max(0, l.home);
    });

    // Wipe transactional data
    state.shows = [];
    state.shipments = [];
    state.transfers = [];
    state.inventory = newInventory;
    state.ui.collapsedTours = {};
    state.ui.selectedOverviewTour = 'CURRENT';
    state.settings.lastYearEndReset = new Date().getFullYear();

    saveData();
    window._yearEndState = null;
    closeModal();
    showToast(`Reset complete. Welcome to ${new Date().getFullYear()}!`, 'fa-calendar-check');
    fireConfetti();
    setTimeout(() => location.reload(), 1200);
};

// Auto-prompt: if it's Jan 1st or later AND we have data from last year AND we haven't already reset this year
const checkYearEndAutoPrompt = () => {
    const now = new Date();
    const currentYear = now.getFullYear();
    const lastReset = state.settings.lastYearEndReset || 0;
    if (lastReset >= currentYear) return; // already reset this year
    // Only prompt on/after Jan 1st of the current year
    // Check if we have shows from the previous year
    const hasLastYearData = state.shows.some(s => {
        const y = parseInt((s.date||'').substring(0,4));
        return y && y < currentYear;
    });
    if (hasLastYearData && state.shows.length > 0) {
        // Delay slightly so the dashboard renders first
        setTimeout(() => window.openYearEndResetFlow(true), 1500);
    }
};

// Detect if a parsed JSON object looks like v11 (has the removed items somewhere)
const looksLikeV11 = (obj) => {
    if (!obj) return false;
    // v11 had postcards/tote/mini_cd in inventory or sales
    if (obj.inventory && (obj.inventory.postcards !== undefined || obj.inventory.tote !== undefined || obj.inventory.mini_cd !== undefined)) return true;
    if (obj.settings && obj.settings.designerPercent !== undefined) return true;
    if (obj.shows && obj.shows.some(s => s.sales && (s.sales.postcards || s.sales.tote || s.sales.mini_cd))) return true;
    return false;
};

window.importJSON = () => {
    const raw = document.getElementById('import_json').value.trim();
    if (!raw) return alert('Paste JSON first.');

    let parsed;
    try {
        parsed = JSON.parse(raw);
    } catch(e) {
        return alert('Invalid JSON: ' + e.message);
    }

    // Strip _meta if present (from v12 export)
    if (parsed._meta) delete parsed._meta;

    // Sanity check - must look like our data shape
    if (!parsed.shows && !parsed.shipments && !parsed.inventory) {
        return alert('This JSON does not look like merch app data. Expected fields like "shows", "shipments", "inventory" not found.');
    }

    const isV11 = looksLikeV11(parsed);
    const summary = `Found:\n• ${(parsed.shows||[]).length} shows\n• ${(parsed.shipments||[]).length} shipments\n• ${(parsed.transfers||[]).length} transfers\n\nFormat: ${isV11 ? 'v11 (will be migrated to v12)' : 'v12'}\n\n⚠️ This will REPLACE all your current data.\nProceed?`;
    if (!confirm(summary)) return;

    let dataToLoad;
    if (isV11) {
        const {data, log} = migrateFromV11(parsed);
        dataToLoad = data;
        setTimeout(() => {
            alert(`Migration done:\n\n• ${log.gigsTouched} gig(s) updated\n• ${log.postcardSales} postcard sales → Vinyl+Poster bundles\n• ${log.toteSales} tote sales → CD+Poster bundles\n• ${log.miniCdSales} mini-CD sales removed\n\nDesigner cut removed.`);
        }, 100);
    } else {
        dataToLoad = parsed;
    }

    // Replace state
    state = {
        shows: dataToLoad.shows || [],
        shipments: dataToLoad.shipments || [],
        transfers: dataToLoad.transfers || [],
        inventory: dataToLoad.inventory || {},
        settings: dataToLoad.settings || {email:'', lastPrices:{}, dataVersion:12, migrationDone:true},
        ui: dataToLoad.ui || {masterStockCollapsed:true, selectedOverviewTour:'CURRENT', collapsedTours:{}},
        vendorSession: {active:false, stock:{}, prices:{}, sales:[], meta:{}}
    };

    // Ensure all current items have inventory keys
    ITEMS.forEach(item => {
        if (state.inventory[item.id] === undefined) state.inventory[item.id] = 0;
    });

    saveData();
    showToast('Import complete!', 'fa-check-circle');
    setTimeout(() => location.reload(), 800);
};

window.exportCSV=()=>{
    const h=["Date","Tour","City","Venue","Currency","Gross","Venue Cut","Net","Net EUR"];
    let csv="data:text/csv;charset=utf-8,"+h.join(",")+"\r\n";
    state.shows.forEach(s=>{
        const g=calcGross(s);
        const vc=calcVenueCut(s);
        const n=calcNet(s);
        const nE=toEUR(n,s.currency);
        csv+=[s.date,`"${s.tour}"`,`"${s.city}"`,`"${s.venue}"`,s.currency,g.toFixed(2),vc.toFixed(2),n.toFixed(2),nE.toFixed(2)].join(",")+"\r\n";
    });
    const l=document.createElement("a");l.setAttribute("href",encodeURI(csv));l.setAttribute("download","merch.csv");document.body.appendChild(l);l.click();document.body.removeChild(l);
};

window.exportExcel=()=>{
    if (typeof XLSX === 'undefined') return alert('XLSX library not loaded');
    const wb = XLSX.utils.book_new();
    const exportDate = new Date().toISOString().split('T')[0];

    // Helper: apply column widths
    const setColWidths = (ws, widths) => { ws['!cols'] = widths.map(w => ({wch: w})); };
    // Helper: apply autofilter to a range
    const setAutoFilter = (ws, range) => { ws['!autofilter'] = {ref: range}; };
    // Helper: freeze top row
    const freezeTopRow = (ws) => { ws['!freeze'] = {xSplit: 0, ySplit: 1}; ws['!views'] = [{state: 'frozen', ySplit: 1, xSplit: 0}]; };

    // ========== SHEET 1: SUMMARY ==========
    let totalNetEur = 0, totalGrossEur = 0, totalVenueCutEur = 0, totalShipping = 0;
    const byCurrency = {};
    const byPayment = {cash:0, card:0, paypal:0};
    state.shows.forEach(s => {
        const g = calcGross(s), vc = calcVenueCut(s), n = calcNet(s);
        totalGrossEur += toEUR(g, s.currency);
        totalVenueCutEur += toEUR(vc, s.currency);
        totalNetEur += toEUR(n, s.currency);
        byCurrency[s.currency] = byCurrency[s.currency] || {gross:0, net:0, count:0};
        byCurrency[s.currency].gross += g;
        byCurrency[s.currency].net += n;
        byCurrency[s.currency].count++;
        const pm = s.paymentMethods||{cash:n,card:0,paypal:0};
        const ct = (pm.cash+pm.card+pm.paypal)||n;
        const sc = ct>0?(n/ct):0;
        const rate = s.currency==='EUR'?1:(eurRates[s.currency]?(1/eurRates[s.currency]):1);
        byPayment.cash += pm.cash*sc*rate;
        byPayment.card += pm.card*sc*rate;
        byPayment.paypal += pm.paypal*sc*rate;
    });
    state.shipments.forEach(s => {let c=parseFloat(s.shipping)||0;s.items.forEach(i=>c+=(i.qty*i.cost));totalShipping+=c;});

    const summaryData = [
        ['SHAI MAESTRO MERCH SALES — FULL EXPORT'],
        [`Generated: ${exportDate}`],
        [],
        ['HEADLINE NUMBERS (EUR)'],
        ['Total Gross', Math.round(totalGrossEur)],
        ['Total Venue Cuts', -Math.round(totalVenueCutEur)],
        ['Total Net (gigs)', Math.round(totalNetEur)],
        ['Total Shipping Costs', -Math.round(totalShipping)],
        ['NET AFTER SHIPPING', Math.round(totalNetEur - totalShipping)],
        [],
        ['BY CURRENCY (native amounts)'],
        ['Currency', 'Gigs', 'Gross', 'Net'],
        ...Object.entries(byCurrency).map(([cur, d]) => [cur, d.count, Math.round(d.gross), Math.round(d.net)]),
        [],
        ['PAYMENT METHOD SPLIT (EUR, est.)'],
        ['Cash', Math.round(byPayment.cash)],
        ['Card', Math.round(byPayment.card)],
        ['PayPal', Math.round(byPayment.paypal)],
        [],
        ['INVENTORY SNAPSHOT'],
        ['Item', 'Home', 'Tour', 'Total'],
        ...ITEMS.map(i => {const l=getStockLevels(i.id);return [i.label, l.home, l.tour, l.home+l.tour];}),
        [],
        ['EXCHANGE RATES (per EUR, used at export)'],
        ['Rates updated', ratesUpdatedAt ? ratesUpdatedAt.toISOString() : 'fallback'],
        ...Object.entries(eurRates).slice(0,15).map(([c,r])=>[c, r])
    ];
    const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
    setColWidths(wsSummary, [30, 18, 15, 15]);
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

    // ========== SHEET 2: GIGS ==========
    const gigHeaders = ['Date','Tour','City','Venue','Currency','Gross','Venue Cut Type','Venue Cut Amount','Venue Cut %','Venue Cut Calc','Net','Net (EUR)','Cash','Card','PayPal','Items Sold (count)','Bundles Sold (count)'];
    const gigRows = state.shows.map(s => {
        const g = calcGross(s), vc = calcVenueCut(s), n = calcNet(s);
        let itemQty = 0, bundleQty = 0;
        Object.entries(s.sales||{}).forEach(([k,v]) => {
            if (isBundle(k)) bundleQty += v.qty;
            else itemQty += v.qty;
        });
        const pm = s.paymentMethods||{cash:0,card:0,paypal:0};
        return [
            s.date, s.tour, s.city, s.venue, s.currency,
            +g.toFixed(2),
            s.venueCutType||'percent',
            s.venueCutAmount||0,
            s.venuePercent||0,
            +vc.toFixed(2),
            +n.toFixed(2),
            +toEUR(n, s.currency).toFixed(2),
            pm.cash, pm.card, pm.paypal,
            itemQty, bundleQty
        ];
    });
    // Sort by date
    gigRows.sort((a,b) => (a[0]||'').localeCompare(b[0]||''));
    // Totals row
    const totals = ['TOTAL','','','','',
        gigRows.reduce((s,r)=>s+(r[5]||0),0).toFixed(2),
        '','','',
        gigRows.reduce((s,r)=>s+(r[9]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[10]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[11]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[12]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[13]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[14]||0),0).toFixed(2),
        gigRows.reduce((s,r)=>s+(r[15]||0),0),
        gigRows.reduce((s,r)=>s+(r[16]||0),0)
    ];
    const wsGigs = XLSX.utils.aoa_to_sheet([gigHeaders, ...gigRows, [], totals]);
    setColWidths(wsGigs, [12, 22, 18, 28, 8, 10, 14, 14, 12, 14, 12, 12, 10, 10, 10, 14, 16]);
    if (gigRows.length > 0) setAutoFilter(wsGigs, `A1:Q${gigRows.length+1}`);
    freezeTopRow(wsGigs);
    XLSX.utils.book_append_sheet(wb, wsGigs, 'Gigs');

    // ========== SHEET 3: SALES BY ITEM ==========
    const salesHeaders = ['Date','Tour','City','Venue','Currency','Item ID','Item Label','Type','Qty','Unit Price','Line Total','Line Total (EUR)'];
    const salesRows = [];
    state.shows.forEach(s => {
        Object.entries(s.sales||{}).forEach(([k,v]) => {
            const item = getSellable(k);
            const lineTotal = v.qty * v.price;
            salesRows.push([
                s.date, s.tour, s.city, s.venue, s.currency,
                k, item.label || k,
                isBundle(k) ? 'Bundle' : 'Item',
                v.qty, v.price,
                +lineTotal.toFixed(2),
                +toEUR(lineTotal, s.currency).toFixed(2)
            ]);
        });
    });
    salesRows.sort((a,b) => (a[0]||'').localeCompare(b[0]||''));
    const wsSales = XLSX.utils.aoa_to_sheet([salesHeaders, ...salesRows]);
    setColWidths(wsSales, [12, 22, 18, 28, 8, 22, 22, 8, 6, 10, 12, 14]);
    if (salesRows.length > 0) setAutoFilter(wsSales, `A1:L${salesRows.length+1}`);
    freezeTopRow(wsSales);
    XLSX.utils.book_append_sheet(wb, wsSales, 'Sales by Item');

    // ========== SHEET 4: SHIPMENTS ==========
    const shipHeaders = ['Date','Invoice','Ship To City','Ship To Country','# Line Items','Items Cost (€)','Shipping (€)','Total (€)','Paid','Paid Date','Items Detail'];
    const shipRows = state.shipments.map(sh => {
        let itemsCost = 0;
        sh.items.forEach(i => itemsCost += (i.qty * i.cost));
        const shipping = parseFloat(sh.shipping)||0;
        const detail = sh.items.map(i => `${getItem(i.itemId).label||i.itemId} x${i.qty} @€${i.cost}`).join('; ');
        return [
            sh.date, sh.invoice||'', sh.shipCity||'', sh.shipCountry||'',
            sh.items.length, +itemsCost.toFixed(2), +shipping.toFixed(2), +(itemsCost+shipping).toFixed(2),
            sh.paid?'Yes':'No', sh.paidDate||'', detail
        ];
    });
    shipRows.sort((a,b) => (a[0]||'').localeCompare(b[0]||''));
    const shipTotals = ['TOTAL','','','','',
        shipRows.reduce((s,r)=>s+(r[5]||0),0).toFixed(2),
        shipRows.reduce((s,r)=>s+(r[6]||0),0).toFixed(2),
        shipRows.reduce((s,r)=>s+(r[7]||0),0).toFixed(2),
        '','',''
    ];
    const wsShip = XLSX.utils.aoa_to_sheet([shipHeaders, ...shipRows, [], shipTotals]);
    setColWidths(wsShip, [12, 14, 18, 14, 12, 14, 12, 12, 8, 12, 60]);
    if (shipRows.length > 0) setAutoFilter(wsShip, `A1:K${shipRows.length+1}`);
    freezeTopRow(wsShip);
    XLSX.utils.book_append_sheet(wb, wsShip, 'Shipments');

    // ========== SHEET 5: INVENTORY ==========
    const invHeaders = ['Item ID','Item Label','Type','Initial (Master)','Shipments In','Net Transfers (to tour - from tour)','Sold + Free (incl. bundles)','Home','Tour','Total','Low Threshold','Below Threshold?'];
    const invRows = ITEMS.map(i => {
        const l = getStockLevels(i.id);
        // breakdown
        let shipIn = 0;
        state.shipments.forEach(sh => sh.items.forEach(it => {if(it.itemId===i.id) shipIn += it.qty;}));
        let netTrans = 0;
        state.transfers.forEach(t => {
            const q = t.items[i.id]||0;
            if (t.type==='TO_TOUR') netTrans += q;
            else netTrans -= q;
        });
        let soldFree = 0;
        state.shows.forEach(s => {
            if (s.sales?.[i.id]) soldFree += s.sales[i.id].qty;
            if (s.freebies?.[i.id]) soldFree += s.freebies[i.id];
            BUNDLES.forEach(b => {
                if (b.components.includes(i.id)) {
                    if (s.sales?.[b.id]) soldFree += s.sales[b.id].qty;
                    if (s.freebies?.[b.id]) soldFree += s.freebies[b.id];
                }
            });
        });
        return [i.id, i.label, i.type, state.inventory[i.id]||0, shipIn, netTrans, soldFree, l.home, l.tour, l.home+l.tour, i.lowThreshold, l.home<i.lowThreshold?'YES':'No'];
    });
    const wsInv = XLSX.utils.aoa_to_sheet([invHeaders, ...invRows]);
    setColWidths(wsInv, [16, 22, 8, 14, 14, 14, 14, 8, 8, 8, 14, 18]);
    freezeTopRow(wsInv);
    XLSX.utils.book_append_sheet(wb, wsInv, 'Inventory');

    // ========== SHEET 6: TOURS ==========
    const tourHeaders = ['Tour','# Gigs','First Date','Last Date','Gross (EUR)','Venue Cuts (EUR)','Net (EUR)','Avg Net/Gig (EUR)','Currencies'];
    const tourMap = {};
    state.shows.forEach(s => {
        const t = s.tour||'Individual Gig';
        if (!tourMap[t]) tourMap[t] = {count:0, dates:[], gross:0, vc:0, net:0, currencies:new Set()};
        tourMap[t].count++;
        tourMap[t].dates.push(s.date);
        tourMap[t].gross += toEUR(calcGross(s), s.currency);
        tourMap[t].vc += toEUR(calcVenueCut(s), s.currency);
        tourMap[t].net += toEUR(calcNet(s), s.currency);
        tourMap[t].currencies.add(s.currency);
    });
    const tourRows = Object.entries(tourMap).map(([name, d]) => {
        const sorted = d.dates.sort();
        return [name, d.count, sorted[0], sorted[sorted.length-1], +d.gross.toFixed(2), +d.vc.toFixed(2), +d.net.toFixed(2), +(d.net/d.count).toFixed(2), [...d.currencies].join(',')];
    });
    tourRows.sort((a,b) => (b[2]||'').localeCompare(a[2]||''));
    const wsTours = XLSX.utils.aoa_to_sheet([tourHeaders, ...tourRows]);
    setColWidths(wsTours, [25, 8, 12, 12, 14, 14, 14, 16, 14]);
    if (tourRows.length > 0) setAutoFilter(wsTours, `A1:I${tourRows.length+1}`);
    freezeTopRow(wsTours);
    XLSX.utils.book_append_sheet(wb, wsTours, 'Tours');

    // ========== SHEET 7: BUNDLE ANALYSIS ==========
    const bundleHeaders = ['Bundle','# Sold (all-time)','Total Revenue (EUR)','Avg Price (EUR)','Components Pulled'];
    const bundleRows = BUNDLES.map(b => {
        let sold = 0, revenue = 0;
        state.shows.forEach(s => {
            if (s.sales?.[b.id]) {
                sold += s.sales[b.id].qty;
                revenue += toEUR(s.sales[b.id].qty * s.sales[b.id].price, s.currency);
            }
        });
        const compList = b.components.map(c => `${getItem(c).label}: ${sold}`).join(' | ');
        return [b.label, sold, +revenue.toFixed(2), sold>0?+(revenue/sold).toFixed(2):0, compList];
    });
    const wsBundles = XLSX.utils.aoa_to_sheet([bundleHeaders, ...bundleRows]);
    setColWidths(wsBundles, [22, 14, 18, 14, 50]);
    freezeTopRow(wsBundles);
    XLSX.utils.book_append_sheet(wb, wsBundles, 'Bundle Analysis');

    // Write file
    XLSX.writeFile(wb, `shai_maestro_merch_${exportDate}.xlsx`);
    showToast('Excel exported!', 'fa-file-excel');
    if (window._yearEndState) { window._yearEndState.excelBackedUp = true; window.renderYearEndModal(); }
};
