<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shai Maestro Merch Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; background-color: #0f172a; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; } .view-section.active { display: block; opacity: 1; }
        .input-modern { @apply w-full border-2 border-slate-200 rounded-xl px-4 py-3 font-bold focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:outline-none transition-all shadow-sm appearance-none; background-color: #ffffff !important; color: #000000 !important; }
        input[type="date"] { background-color: white !important; } select.input-modern { background-color: #ffffff !important; color: #000000 !important; }
        .card-modern { @apply bg-slate-800 rounded-2xl p-5 shadow-xl border border-slate-700/50 mb-5 relative overflow-hidden; }
        .btn-primary { @apply w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg shadow-blue-900/40 transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-3 text-lg; }
        .btn-save-gig { @apply w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-black py-5 px-6 rounded-3xl transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-4 text-xl tracking-wide uppercase border-t border-emerald-400/20; }
        .btn-fun { @apply w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-black py-4 px-6 rounded-2xl shadow-xl transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-3 text-lg tracking-wide uppercase; }
        .btn-vendor { @apply w-full bg-slate-700 hover:bg-slate-600 active:bg-blue-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg border border-slate-600 transition-all duration-150 flex flex-col items-center justify-center relative overflow-hidden; height: 140px; }
        .btn-secondary { @apply w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-3 px-4 rounded-xl shadow border border-slate-600 transform transition-all active:scale-95 flex justify-center items-center gap-2; }
        .btn-danger { @apply w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-extrabold py-3 px-6 rounded-2xl shadow-lg transform transition-all duration-200 active:scale-95 flex justify-center items-center gap-2 text-sm; }
        .nav-btn { @apply text-slate-500 transition-all duration-300 flex flex-col items-center justify-center h-full w-full relative z-10; }
        .nav-active { @apply text-blue-400; }
        .nav-active::before { content: ''; position: absolute; width: 3.5rem; height: 3.5rem; border-radius: 9999px; border: 1px solid rgba(96,165,250,0.3); background: rgba(59,130,246,0.1); z-index: -1; bottom: 40%; transform: translateY(20%); box-shadow: 0 0 20px rgba(96,165,250,0.4); }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        #toast { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 130px; }
        .input-group-text-overlay { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #94a3b8; font-weight: 800; }
        .tour-header { @apply cursor-pointer select-none transition-all active:scale-95; }
        .capacity-bar { height: 6px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,0.1); }
        .capacity-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-32 selection:bg-blue-500 selection:text-white overflow-x-hidden">
    <canvas id="confetti-canvas"></canvas>
    <header class="fixed top-0 w-full bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 z-50 px-5 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3"><div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10"><i class="fas fa-music text-white text-lg"></i></div><div><h1 class="text-lg font-extrabold tracking-tight text-white leading-none">Shai Maestro</h1><p class="text-[10px] text-blue-400 font-bold tracking-widest uppercase mt-0.5">Merch Sales</p></div></div>
        <button onclick="router('settings')" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition shadow-inner border border-slate-700"><i class="fas fa-cog"></i></button>
    </header>
    <main id="app-content" class="pt-28 px-4 max-w-lg mx-auto relative min-h-screen">
        <div id="view-dashboard" class="view-section active"></div><div id="view-add-show" class="view-section"></div><div id="view-vendor" class="view-section"></div><div id="view-tour-stock" class="view-section"></div><div id="view-inventory" class="view-section"></div><div id="view-label" class="view-section"></div><div id="view-settings" class="view-section"></div>
    </main>
    <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4"><div class="bg-slate-800 rounded-2xl w-full max-w-sm border border-slate-700 shadow-2xl transform transition-all scale-95 opacity-0" id="modalContent"><div class="p-6"><div class="flex justify-between items-start mb-4"><h3 class="text-xl font-bold text-white text-center w-full" id="modalTitle">Details</h3><button onclick="closeModal()" class="absolute right-6 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button></div><div id="modalBody" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar"></div><div class="mt-6 pt-4 border-t border-slate-700 space-y-3" id="modalFooter"></div></div></div></div>
    <div id="toast"><div class="flex items-center justify-center gap-3"><i class="fas fa-check-circle text-green-400 text-xl" id="toastIcon"></i><span id="toastMsg" class="font-bold">Action Saved</span></div><button onclick="handleUndo()" id="undoBtn" class="mt-2 text-xs text-blue-300 underline font-bold uppercase tracking-wider block w-full">Undo</button></div>
    <nav class="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-2xl border-t border-slate-800 pb-safe z-50 h-24 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]"><div class="flex justify-between items-center h-16 max-w-lg mx-auto px-1 pt-2">
        <button id="nav-dashboard" onclick="router('dashboard')" class="nav-btn nav-active"><i class="fas fa-chart-pie mb-1"></i><span class="text-[9px] font-bold uppercase">Overview</span></button>
        <button id="nav-add-show" onclick="router('add-show')" class="nav-btn"><i class="fas fa-glasses mb-1"></i><span class="text-[9px] font-bold uppercase">Gig Log</span></button>
        <button id="nav-vendor" onclick="router('vendor')" class="nav-btn"><div class="bg-blue-600 rounded-full w-12 h-12 flex items-center justify-center shadow-lg shadow-blue-500/40 transform -translate-y-3 border-4 border-slate-900 relative z-20"><i class="fas fa-plus text-white text-xl"></i></div><span class="text-[9px] font-bold uppercase absolute -bottom-1 w-full text-center">Vendor</span></button>
        <button id="nav-tour-stock" onclick="router('tour-stock')" class="nav-btn"><i class="fas fa-bus mb-1"></i><span class="text-[9px] font-bold uppercase">Tour</span></button>
        <button id="nav-inventory" onclick="router('inventory')" class="nav-btn"><i class="fas fa-warehouse mb-1"></i><span class="text-[9px] font-bold uppercase">Home</span></button>
        <button id="nav-label" onclick="router('label')" class="nav-btn"><i class="fas fa-file-invoice mb-1"></i><span class="text-[9px] font-bold uppercase">Label</span></button>
    </div></nav>
    <script>
const DB_KEY='shai_maestro_merch_v11';
const SUITCASE_LIMITS={vinyl:40,cd:100};
const CURRENCIES=[{code:'EUR',symbol:'€',name:'Euro'},{code:'GBP',symbol:'£',name:'British Pound'},{code:'USD',symbol:'$',name:'US Dollar'},{code:'CHF',symbol:'Fr',name:'Swiss Franc'},{code:'CZK',symbol:'Kč',name:'Czech Koruna'},{code:'DKK',symbol:'kr',name:'Danish Krone'},{code:'HUF',symbol:'Ft',name:'Hungarian Forint'},{code:'ISK',symbol:'kr',name:'Icelandic Króna'},{code:'NOK',symbol:'kr',name:'Norwegian Krone'},{code:'PLN',symbol:'zł',name:'Polish Zloty'},{code:'RON',symbol:'lei',name:'Romanian Leu'},{code:'RSD',symbol:'дин',name:'Serbian Dinar'},{code:'SEK',symbol:'kr',name:'Swedish Krona'},{code:'GEL',symbol:'₾',name:'Georgian Lari'},{code:'ILS',symbol:'₪',name:'Israeli Shekel'},{code:'CAD',symbol:'$',name:'Canadian Dollar'},{code:'BRL',symbol:'R$',name:'Brazilian Real'},{code:'JPY',symbol:'¥',name:'Japanese Yen'},{code:'KRW',symbol:'₩',name:'S. Korean Won'},{code:'INR',symbol:'₹',name:'Indian Rupee'},{code:'HKD',symbol:'$',name:'Hong Kong Dollar'},{code:'MXN',symbol:'$',name:'Mexican Peso'},{code:'THB',symbol:'฿',name:'Thai Baht'},{code:'CNY',symbol:'¥',name:'Chinese Yuan'},{code:'CLP',symbol:'$',name:'Chilean Peso'}];
const getSym=(c)=>{const f=CURRENCIES.find(x=>x.code===c);return f?f.symbol:c;};
const curOpts=(sel)=>CURRENCIES.map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${c.code} — ${c.symbol} ${c.name}</option>`).join('');
const ITEMS=[{id:'guest_vinyl',label:'GUESTHOUSE VINYL',icon:'fa-record-vinyl',type:'vinyl',color:'text-indigo-400',bg:'bg-indigo-400/10',border:'border-indigo-500/30',lowThreshold:60},{id:'guest_cd',label:'GUESTHOUSE CD',icon:'fa-compact-disc',type:'cd',color:'text-cyan-300',bg:'bg-cyan-300/10',border:'border-cyan-400/30',lowThreshold:60},{id:'mini_vinyl',label:'MINIATURES VINYL',icon:'fa-record-vinyl',type:'vinyl',color:'text-purple-400',bg:'bg-purple-400/10',border:'border-purple-500/30',lowThreshold:60},{id:'mini_cd',label:'MINIATURES CD',icon:'fa-compact-disc',type:'cd',color:'text-sky-300',bg:'bg-sky-300/10',border:'border-sky-400/30',lowThreshold:60},{id:'postcards',label:'POSTCARDS',icon:'fa-image',type:'merch',color:'text-emerald-400',bg:'bg-emerald-400/10',border:'border-emerald-500/30',lowThreshold:100},{id:'poster',label:'POSTERS',icon:'fa-scroll',type:'merch',color:'text-teal-400',bg:'bg-teal-400/10',border:'border-teal-500/30',lowThreshold:30},{id:'tote',label:'TOTE BAGS',icon:'fa-shopping-bag',type:'merch',color:'text-green-400',bg:'bg-green-400/10',border:'border-green-500/30',lowThreshold:30}];
const TC=[{bg:'bg-purple-900/40',border:'border-purple-500',text:'text-purple-400',line:'bg-purple-500'},{bg:'bg-blue-900/40',border:'border-blue-500',text:'text-blue-400',line:'bg-blue-500'},{bg:'bg-emerald-900/40',border:'border-emerald-500',text:'text-emerald-400',line:'bg-emerald-500'},{bg:'bg-amber-900/40',border:'border-amber-500',text:'text-amber-400',line:'bg-amber-500'},{bg:'bg-pink-900/40',border:'border-pink-500',text:'text-pink-400',line:'bg-pink-500'},{bg:'bg-cyan-900/40',border:'border-cyan-500',text:'text-cyan-400',line:'bg-cyan-500'}];
let state={shows:[],shipments:[],transfers:[],inventory:{},settings:{designerPercent:10,email:'',lastPrices:{},notifiedLowStock:{}},ui:{masterStockCollapsed:true,selectedOverviewTour:'CURRENT',collapsedTours:{}},vendorSession:{active:false,stock:{},prices:{},sales:[],meta:{}}};
let tempShipmentItems=[],editingShipmentId=null,editingShowId=null,lastUndoAction=null,pendingVendorData=null,eurRates={EUR:1,USD:1.1,GBP:0.85,ILS:4.0,CZK:25.0,PLN:4.3,BRL:5.5,CAD:1.5,CLP:980,CNY:7.8,DKK:7.5,GEL:2.9,HKD:8.5,HUF:390,ISK:150,INR:90,JPY:160,KRW:1450,MXN:19,NOK:11.5,RON:5.0,RSD:117,SEK:11.3,CHF:0.95,THB:39};
let lastLabelSelection=ITEMS[0].id;
const loadData=()=>{const saved=localStorage.getItem(DB_KEY);if(saved){try{const p=JSON.parse(saved);state={...state,...p};if(!state.vendorSession.meta)state.vendorSession.meta={};if(!state.ui.collapsedTours)state.ui.collapsedTours={};}catch(e){}}ITEMS.forEach(item=>{if(state.inventory[item.id]===undefined)state.inventory[item.id]=0;});fetch('https://api.exchangerate-api.com/v4/latest/EUR').then(r=>r.json()).then(d=>{eurRates=d.rates;window.renderDashboard();}).catch(e=>{});};
const saveData=()=>{localStorage.setItem(DB_KEY,JSON.stringify(state));};
const showToast=(msg,icon='fa-check-circle')=>{const t=document.getElementById('toast');document.getElementById('toastMsg').innerText=msg;document.getElementById('toastIcon').className=`fas ${icon} text-xl`;t.className="show";setTimeout(()=>t.className="",4000);};
const setUndo=(type,data)=>{lastUndoAction={type,data};showToast("Action Saved");};
const handleUndo=()=>{if(!lastUndoAction)return;if(lastUndoAction.type==='add_show')state.shows.pop();else if(lastUndoAction.type==='add_shipment')state.shipments.pop();else if(lastUndoAction.type==='transfer')state.transfers.pop();saveData();location.reload();};
const getStockLevels=(itemId)=>{let home=state.inventory[itemId]||0,tour=0;state.shipments.forEach(s=>s.items.forEach(i=>{if(i.itemId===itemId)home+=(parseInt(i.qty)||0);}));state.transfers.forEach(t=>{const qty=t.items[itemId]||0;if(t.type==='TO_TOUR'){home-=qty;tour+=qty;}else{tour-=qty;home+=qty;}});state.shows.forEach(s=>{if(s.sales?.[itemId])tour-=(parseInt(s.sales[itemId].qty)||0);if(s.freebies?.[itemId])tour-=(parseInt(s.freebies[itemId])||0);});return{home,tour};};
const getItem=(id)=>ITEMS.find(i=>i.id===id)||{};
const getTourCap=()=>{let v=0,c=0;ITEMS.forEach(i=>{const l=getStockLevels(i.id);if(i.type==='vinyl')v+=l.tour;else if(i.type==='cd')c+=l.tour;});return{vinyl:v,cd:c,vMax:SUITCASE_LIMITS.vinyl,cMax:SUITCASE_LIMITS.cd,vPct:Math.min(100,Math.round(v/SUITCASE_LIMITS.vinyl*100)),cPct:Math.min(100,Math.round(c/SUITCASE_LIMITS.cd*100)),vOver:v>SUITCASE_LIMITS.vinyl,cOver:c>SUITCASE_LIMITS.cd};};
const calcNet=(s)=>{let g=0,m=0;ITEMS.forEach(i=>{const x=s.sales?.[i.id];if(x&&x.qty>0){const a=x.qty*x.price;g+=a;if(i.type==='merch')m+=a;}});const vc=g*((s.venuePercent||0)/100);const mn=m*(1-(s.venuePercent||0)/100);const dc=mn*((state.settings.designerPercent||0)/100);return g-vc-dc;};

window.renderDashboard=()=>{
    const el=document.getElementById('view-dashboard');
    const tours=[...new Set(state.shows.map(s=>s.tour).filter(Boolean))].reverse();
    const selTour=state.ui.selectedOverviewTour==='CURRENT'?(tours[0]||""):state.ui.selectedOverviewTour;
    let yr={net:0,cash:0,card:0,pp:0,shani:0},tr={net:0,cash:0,card:0,pp:0,shani:0},exp=0,trCur={},yrCur={};
    state.shows.forEach(s=>{const cur=s.currency||'EUR';const rate=cur==='EUR'?1:(eurRates[cur]?(1/eurRates[cur]):1);const net=calcNet(s);const netE=net*rate;let g=0,m=0;ITEMS.forEach(i=>{const x=s.sales?.[i.id];if(x&&x.qty>0){const a=x.qty*x.price;g+=a;if(i.type==='merch')m+=a;}});const mn=m*(1-(s.venuePercent||0)/100);const dc=mn*((state.settings.designerPercent||0)/100)*rate;yr.net+=netE;yr.shani+=dc;yrCur[cur]=(yrCur[cur]||0)+net;const pm=s.paymentMethods||{cash:net,card:0,paypal:0};const ct=(pm.cash+pm.card+pm.paypal)||net;const sc=ct>0?(net/ct):0;yr.cash+=(pm.cash*sc)*rate;yr.card+=(pm.card*sc)*rate;yr.pp+=(pm.paypal*sc)*rate;if(s.tour===selTour){tr.net+=netE;tr.shani+=dc;tr.cash+=(pm.cash*sc)*rate;tr.card+=(pm.card*sc)*rate;tr.pp+=(pm.paypal*sc)*rate;trCur[cur]=(trCur[cur]||0)+net;}});
    state.shipments.forEach(s=>{let c=parseFloat(s.shipping)||0;s.items.forEach(i=>c+=(i.qty*i.cost));exp+=c;});yr.net-=exp;
    const bkd=(o)=>`<div class="flex gap-3 text-[10px] font-bold text-slate-400 mt-2 bg-slate-900/50 px-3 py-2 rounded-lg border border-slate-700/50"><div><span class="text-green-400">Cash:</span> €${Math.round(o.cash).toLocaleString()}</div><div><span class="text-blue-400">Card:</span> €${Math.round(o.card).toLocaleString()}</div><div><span class="text-indigo-400">PP:</span> €${Math.round(o.pp).toLocaleString()}</div></div>`;
    const curBkd=(obj)=>{const e=Object.entries(obj);if(e.length<=1)return '';return `<div class="flex flex-wrap gap-2 mt-2 justify-center">${e.map(([c,a])=>`<span class="text-[10px] font-bold bg-slate-900/60 px-2 py-1 rounded-lg border border-slate-700/50 text-slate-300">${getSym(c)}${Math.round(a).toLocaleString()} <span class="text-slate-500">${c}</span></span>`).join('')}</div>`;};
    const grp=[];let cg=null;[...state.shows].reverse().forEach(s=>{const tn=s.tour||"Individual Gig";if(!cg||cg.tn!==tn||tn==="Individual Gig"){cg={tn,shows:[]};grp.push(cg);}cg.shows.push(s);});
    const actHtml=grp.map(g=>{const isI=g.tn==="Individual Gig";const ci=g.tn.split('').reduce((a,b)=>a+b.charCodeAt(0),0)%TC.length;const th=isI?{border:'border-slate-700',text:'text-slate-400',bg:'bg-slate-800',line:'hidden'}:TC[ci];if(isI){const s=g.shows[0];return `<div onclick="openGigModal(${s.id})" class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center active:scale-95 transition-transform cursor-pointer hover:border-blue-500/50 shadow-lg mb-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-400">${s.city.substring(0,2).toUpperCase()}</div><div class="text-left"><h3 class="font-bold text-white text-base leading-none mb-1">${s.city}</h3><p class="text-xs text-slate-400 font-bold">${s.venue}</p></div></div><div class="text-right"><span class="block text-[10px] font-bold text-slate-500 bg-slate-900/50 px-2 py-0.5 rounded-full mb-1 inline-block">Single Gig</span><span class="block text-[10px] text-slate-500 font-mono font-bold">${s.date}</span></div></div>`;}
    const col=state.ui.collapsedTours[g.tn];let ttn=0;g.shows.forEach(s=>{ttn+=calcNet(s)*(s.currency==='EUR'?1:(eurRates[s.currency]?(1/eurRates[s.currency]):1));});
    const hd=`<div onclick="toggleTourCollapse('${g.tn}')" class="tour-header relative z-20 ${th.bg} border-l-4 ${th.border} p-3 rounded-r-xl mb-2 flex justify-between items-center shadow-md"><div><h3 class="text-xs font-black uppercase ${th.text} tracking-widest flex items-center gap-2"><i class="fas ${col?'fa-chevron-right':'fa-chevron-down'}"></i> ${g.tn}</h3><p class="text-[9px] text-slate-300 font-bold mt-1">${g.shows.length} Gigs • ${g.shows[g.shows.length-1].date} - ${g.shows[0].date}</p></div><div class="text-right"><span class="block text-sm font-extrabold text-white">€${Math.round(ttn).toLocaleString()}</span><span class="text-[9px] text-slate-400 uppercase font-bold">Total Net</span></div></div>`;
    if(col)return hd;
    const gh=g.shows.map((s,i)=>{const il=i===g.shows.length-1;return `<div class="relative pl-6 mb-2"><div class="absolute left-2.5 top-0 bottom-0 w-0.5 ${th.line} opacity-40 ${il?'h-1/2':''}"></div><div onclick="openGigModal(${s.id})" class="bg-slate-800 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center active:scale-95 transition-transform cursor-pointer relative z-10 hover:border-slate-500"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full ${th.bg} flex items-center justify-center font-bold text-[10px] ${th.text} border ${th.border}">${s.city.substring(0,2).toUpperCase()}</div><div><h4 class="font-bold text-white text-sm">${s.city}</h4><p class="text-[10px] text-slate-400">${s.venue}</p></div></div><div class="text-right"><span class="text-[10px] font-mono font-bold text-slate-500">${s.date}</span></div></div></div>`;}).join('');
    return `<div class="mb-4">${hd}<div class="mt-1">${gh}</div></div>`;}).join('');

window.startVendor=()=>{const d=document.getElementById('v_date').value,ci=document.getElementById('v_city').value,ve=document.getElementById('v_venue').value,cu=document.getElementById('v_cur').value,vp=parseFloat(document.getElementById('v_vp').value)||0;if(!ci||!ve)return alert("Enter City and Venue");const st={},pr={};ITEMS.forEach(i=>{st[i.id]=parseInt(document.getElementById(`v_q_${i.id}`).value)||0;pr[i.id]=parseFloat(document.getElementById(`v_p_${i.id}`).value)||0;});state.vendorSession={active:true,stock:st,prices:pr,sales:[],meta:{date:d,city:ci,venue:ve,currency:cu,venuePercent:vp}};saveData();window.renderVendor();};

nter"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-lg ${i.bg} ${i.border} border flex items-center justify-center"><i class="fas ${i.icon} ${i.color} text-lg"></i></div><div><span class="text-sm font-bold text-slate-200">${i.label}</span>${lo?'<br><span class="text-[10px] text-red-400 font-bold animate-pulse">Low!</span>':''}</div></div><div class="flex items-center gap-6"><div class="flex flex-col items-center"><span class="text-[10px] text-blue-400 font-bold uppercase">Bus</span><span class="text-2xl font-extrabold ${lo?'text-red-400':'text-blue-400'}">${l.tour}</span></div><div class="w-px h-8 bg-slate-700"></div><div class="flex flex-col items-center"><span class="text-[10px] text-slate-500 font-bold uppercase">Home</span><span class="text-lg font-bold text-slate-400">${l.home}</span></div></div></div>`}).join('')}</div></div></div>`;};

const fireConfetti=()=>{const canvas=document.getElementById('confetti-canvas'),ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const p=[];for(let i=0;i<100;i++)p.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,vx:Math.random()*4-2,vy:Math.random()*5+5,color:`hsl(${Math.random()*360},70%,50%)`,size:Math.random()*8+4});const a=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);let act=false;p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);if(p.y<canvas.height)act=true;});if(act)requestAnimationFrame(a);else ctx.clearRect(0,0,canvas.width,canvas.height);};a();};
